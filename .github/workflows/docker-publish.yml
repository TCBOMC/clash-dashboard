name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - '**'
      - '!README.md'
      - '!.version.json'
  workflow_dispatch:
    inputs:
      version_bump:
        description: '版本类型 (major/minor/patch)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  VERSION_FILE: .version.json

jobs:
  version-manager:
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.version.outputs.full_version }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version
        id: version
        run: |
          # 获取最新的正式版本 tag（排除 build tag）
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1 || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          LATEST_VERSION=${LATEST_TAG#v}
          echo "Latest version: $LATEST_VERSION"
          
          # 初始化 version.json（如果不存在）
          if [ ! -f "$VERSION_FILE" ]; then
            echo "{\"tag\":\"$LATEST_TAG\",\"build\":0}" > $VERSION_FILE
            echo "Created version.json from tag: $LATEST_TAG"
          fi
          
          # 读取 version.json
          SAVED_TAG=$(jq -r '.tag' $VERSION_FILE)
          BUILD=$(jq -r '.build' $VERSION_FILE)
          echo "Saved tag: $SAVED_TAG, build: $BUILD"
          
          # 判断触发类型
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # 情况1: 新 tag 触发
            NEW_TAG="${{ github.ref_name }}"
            NEW_VERSION=${NEW_TAG#v}
            echo "New tag detected: $NEW_TAG"
            
            # 更新 version.json（使用 echo 避免 EOF 问题）
            echo "{\"tag\":\"$NEW_TAG\",\"build\":0}" > $VERSION_FILE
            BUILD=0
            VERSION=$NEW_VERSION
            TAG=$NEW_TAG
            
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.version_bump }}" != "" ]; then
            # 情况2: 手动触发版本升级
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
            
            case "${{ inputs.version_bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            NEW_TAG="v$NEW_VERSION"
            echo "Manual version bump: $NEW_TAG"
            
            # 更新 version.json（使用 echo 避免 EOF 问题）
            echo "{\"tag\":\"$NEW_TAG\",\"build\":0}" > $VERSION_FILE
            BUILD=0
            VERSION=$NEW_VERSION
            TAG=$NEW_TAG
            
          else
            # 情况3: 普通代码更新
            # 检查当前最新的 tag 是否和 version.json 中保存的一致
            if [ "$LATEST_TAG" != "$SAVED_TAG" ]; then
              # 有新的 tag，但这次不是 tag 触发（可能是手动创建的 tag）
              echo "Latest tag changed to $LATEST_TAG, updating version.json"
              echo "{\"tag\":\"$LATEST_TAG\",\"build\":0}" > $VERSION_FILE
              BUILD=0
              VERSION=$LATEST_VERSION
              TAG=$LATEST_TAG
            else
              # 正常的代码更新，build 加 1
              BUILD=$((BUILD + 1))
              VERSION=${SAVED_TAG#v}
              TAG=$SAVED_TAG
              echo "Code update: build number increased to $BUILD"
              
              # 更新 build 号
              echo "{\"tag\":\"$TAG\",\"build\":$BUILD}" > $VERSION_FILE
            fi
          fi
          
          FULL_VERSION="${VERSION}.${BUILD}"
          echo "Final version: $FULL_VERSION"
          
          # 输出版本号
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Commit version file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $VERSION_FILE
          git commit -m "chore: update version to ${{ steps.version.outputs.full_version }} [skip ci]" || echo "No changes to commit"
          git push

  build-push:
    needs: version-manager
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'push' || 
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_REPO }}:latest
            ${{ secrets.DOCKERHUB_REPO }}:v${{ needs.version-manager.outputs.version }}
            ${{ secrets.DOCKERHUB_REPO }}:v${{ needs.version-manager.outputs.full_version }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version-manager.outputs.full_version }}

  update-readme:
    needs: [version-manager, build-push]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Docker Hub README
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_REPO }}
          short-description: "基于 Docker 的 Clash 代理管理面板，开箱即用，支持订阅下载与管理。"
          readme-filepath: ./README.md
          enable-url-completion: true
